name: 每日数据采集与上传

# 流程：9 个站点并行采集 → 汇齐 CSV → processor 清洗 → 上传 R2 → 索引 json 提交回仓库
#
# 为什么采集要拆成 9 个并行 job：串行跑一遍要 2~3 小时（广东 2 万条是大头），
# 逼近单个 job 6 小时上限还有风险。拆开后总耗时 ≈ 最慢那一站。
# 各站本来就是独立的：各写各的 data/{site}_products.csv，互不依赖，
# 所以代码一行都不用改，只要把产出用 artifact 汇聚到处理 job 即可。
#
# 为什么最后要提交回仓库：processor/processeddata 里三个 json 的 upload_at 字段
# 是「上次推送时间」的唯一持久化载体。CI 每次都是全新机器，不提交的话下次运行时
# upload_at 是空的，脚本就会把没变化的文件再传一遍，还拿不到增量判断。

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00（北京 = UTC+8）
    # GitHub 定时任务要排队，整点经常延迟几分钟；想更准可改成 '50 17' 之类错峰
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force_upload:
        description: 忽略 updated_at/upload_at 判定，强制重传全部文件
        type: boolean
        default: false

permissions:
  contents: write        # 允许把产出推回本仓库；GITHUB_TOKEN 自动生效

concurrency:
  group: daily-pipeline
  cancel-in-progress: false   # 采集中途别取消，跑一半的进度在 CI 里留不下来

env:
  TZ: Asia/Shanghai      # 只影响日志与提交信息里的时间显示

jobs:
  # ── 1. 采集：9 个站点各跑一个 job ────────────────────────────────
  crawl:
    name: 采集 ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false   # 一站挂了不影响其他站
      matrix:
        # 超时按站点数据量给，广东 2 万条最久；跑几次后可照实际情况微调
        include:
          - { site: bj, timeout: 60 }
          - { site: sh, timeout: 120 }
          - { site: hz, timeout: 60 }
          - { site: gd, timeout: 180 }
          - { site: gy, timeout: 60 }
          - { site: fj, timeout: 60 }
          - { site: zz, timeout: 30 }
          - { site: bf, timeout: 60 }
          - { site: hi, timeout: 60 }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装依赖
        run: uv sync --frozen

      - name: 采集
        run: uv run python "crawl_${{ matrix.site }}.py"

      # 采集失败也要传：断点续传可能已经写了一半的 CSV，能救回多少是多少
      - name: 暂存 CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.site }}
          path: data/*_products.csv
          if-no-files-found: warn   # 该站一条都没抓到时只警告，不算失败
          retention-days: 1         # 纯中转，不占存储

  # ── 2. 处理 → 上传 → 提交 ───────────────────────────────────────
  pipeline:
    name: 处理并上传
    needs: crawl
    # 用 !cancelled() 而不是默认的「上游必须成功」：
    # 部分站点失败时，剩下几站的数据照样要处理上传，不能整批作废
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装依赖
        run: uv sync --frozen

      - name: 取回各站 CSV
        uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: data
          merge-multiple: true   # 9 份直接摊平进 data/，不按 artifact 名分目录

      - name: 检查采集结果
        run: |
          shopt -s nullglob
          files=(data/*_products.csv)
          echo "收到 ${#files[@]} 份站点数据"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::9 个站点全部采集失败，没有可处理的数据，终止"
            exit 1
          fi

      - name: 清洗并生成统一 CSV
        run: uv run python processor/build_products.py

      - name: 上传到 R2
        env:
          # 走环境变量注入，不在 CI 里落 R2keys.conf —— 脚本里环境变量优先级高于配置文件
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          if [ "${{ inputs.force_upload }}" = "true" ]; then
            uv run python processor/transmitter/transtoR2.py --all --force
          else
            uv run python processor/transmitter/transtoR2.py --all
          fi

      - name: 提交产出回仓库
        run: |
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交三个 json（market / category / product_files）：
          # CSV 数据本体已在 R2，不进仓库 —— 既不撑大体积，public 仓库下也不公开数据。
          # json 里带 upload_at，是下次判断「要不要重新上传」的唯一依据，必须提交。
          git add processor/processeddata/*.json
          if git diff --cached --quiet; then
            echo "本次没有变化，跳过提交"
          else
            git commit -m "chore(data): 每日数据更新 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 汇总
        if: always()
        run: |
          echo "产出的索引文件："
          ls -lh processor/processeddata/*.json || true
